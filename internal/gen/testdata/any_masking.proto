syntax = "proto3";

package protomcp.gen.testdata.anymask.v1;

import "google/protobuf/any.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/anymask;anymaskv1";

service AnyMask {
  rpc Wrap(WrapRequest) returns (WrapReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
}

message WrapRequest {
  google.protobuf.Any payload = 1;
}

message WrapReply {
  google.protobuf.Any payload = 1;
}
