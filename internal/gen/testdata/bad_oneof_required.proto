syntax = "proto3";

package protomcp.gen.testdata.badoneof.v1;

import "buf/validate/validate.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badoneof;badoneofv1";

service BadOneof {
  rpc Pick(PickRequest) returns (PickReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
}

message PickRequest {
  oneof target {
    option (buf.validate.oneof).required = true;

    string id = 1 [(protomcp.v1.field_schema).exclude = true];
    string name = 2 [(protomcp.v1.field_schema).exclude = true];
  }
}

message PickReply {
  string summary = 1;
}
