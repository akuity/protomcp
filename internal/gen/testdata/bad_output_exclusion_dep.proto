syntax = "proto3";

package protomcp.gen.testdata.badoutputexclusiondep.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badoutputexclusiondep;badoutputexclusiondepv1";

message Widget {
  string id = 1;
  // The method name is misspelled, and the service that owns it lives
  // in the file importing this one.
