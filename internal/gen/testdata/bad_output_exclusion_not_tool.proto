syntax = "proto3";

package protomcp.gen.testdata.badoutputexclusionnottool.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badoutputexclusionnottool;badoutputexclusionnottoolv1";

service Widgets {
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }

  // Exists, but is not exposed as a tool, so nothing would ever apply
  // an exclusion scoped to it.
  rpc Audit(ListWidgetsRequest) returns (ListWidgetsReply);
}

message ListWidgetsRequest {
  string filter = 1;
}

message ListWidgetsReply {
  repeated Widget widgets = 1;
}

message Widget {
  string id = 1;
  string notes = 2 [(protomcp.v1.field_schema).exclude_from_outputs = "protomcp.gen.testdata.badoutputexclusionnottool.v1.Widgets.Audit"];
}
