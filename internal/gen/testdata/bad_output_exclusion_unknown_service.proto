syntax = "proto3";

package protomcp.gen.testdata.badoutputexclusionunknownservice.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badoutputexclusionunknownservice;badoutputexclusionunknownservicev1";

service Widgets {
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
}

message ListWidgetsRequest {
  string filter = 1;
}

message ListWidgetsReply {
  repeated Widget widgets = 1;
}

message Widget {
  string id = 1;
  // The service name is misspelled; the method exists on Widgets.
  string notes = 2 [(protomcp.v1.field_schema).exclude_from_outputs = "protomcp.gen.testdata.badoutputexclusionunknownservice.v1.Widgetz.ListWidgets"];
}
