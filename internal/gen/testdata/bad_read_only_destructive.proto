syntax = "proto3";

package protomcp.gen.testdata.badrodestructive.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badrodestructive;badrodestructivev1";

service BadReadOnlyDestructive {
  rpc GetWidget(GetWidgetRequest) returns (GetWidgetReply) {
    option (protomcp.v1.tool) = {
      read_only: true
      destructive: true
    };
  }
}

message GetWidgetRequest {
  string id = 1;
}

message GetWidgetReply {
  string summary = 1;
}
