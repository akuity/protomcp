syntax = "proto3";

package protomcp.gen.testdata.badreadonly.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badreadonly;badreadonlyv1";

service BadReadOnly {
  rpc DeleteWidget(DeleteWidgetRequest) returns (DeleteWidgetReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
}

message DeleteWidgetRequest {
  string id = 1;
}

message DeleteWidgetReply {
  bool ok = 1;
}
