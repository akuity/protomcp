syntax = "proto3";

package protomcp.gen.testdata.badslimbinding.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badslimbinding;badslimbindingv1";

service BadSlimBinding {
  rpc Fetch(BadBindingRequest) returns (BadBindingReply) {
    option (protomcp.v1.resource_template) = {
      uri_template: "bad://{token}"
      uri_bindings: [{placeholder: "token", field: "token"}]
    };
  }
}

message BadBindingRequest {
  string token = 1 [(protomcp.v1.field_schema).exclude = true];
}

message BadBindingReply {
  string summary = 1;
}
