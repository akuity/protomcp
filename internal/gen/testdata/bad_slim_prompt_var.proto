syntax = "proto3";

package protomcp.gen.testdata.badslimpromptvar.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badslimpromptvar;badslimpromptvarv1";

service BadSlimPromptVar {
  rpc Review(BadPromptVarRequest) returns (BadPromptVarReply) {
    option (protomcp.v1.prompt) = {
      template: "Debug: {{debugBlob}}"
    };
  }
}

message BadPromptVarRequest {
  string id = 1;
}

message BadPromptVarReply {
  string summary = 1;
  string debug_blob = 2 [(protomcp.v1.field_schema).exclude = true];
}
