syntax = "proto3";

package protomcp.gen.testdata.badslimprompt.v1;

import "google/api/field_behavior.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badslimprompt;badslimpromptv1";

service BadSlimPrompt {
  rpc Review(ReviewRequest) returns (ReviewReply) {
    option (protomcp.v1.prompt) = {
      template: "Summary: {{summary}}"
    };
  }
}

message ReviewRequest {
  string topic = 1;
  string id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (protomcp.v1.field_schema).exclude = true
  ];
}

message ReviewReply {
  string summary = 1;
}
