syntax = "proto3";

package protomcp.gen.testdata.badslimzero.v1;

import "buf/validate/validate.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/badslimzero;badslimzerov1";

service BadSlimZero {
  rpc Fetch(FetchZeroRequest) returns (FetchZeroReply) {
    option (protomcp.v1.tool) = {};
  }
}

message FetchZeroRequest {
  string id = 1;
  string selector = 2 [
    (buf.validate.field).string.min_len = 1,
    (protomcp.v1.field_schema).exclude = true
  ];
}

message FetchZeroReply {
  string summary = 1;
}
