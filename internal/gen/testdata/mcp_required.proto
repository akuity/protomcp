syntax = "proto3";

package protomcp.gen.testdata.mcprequired.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/mcprequired;mcprequiredv1";

service MCPRequired {
  rpc Render(MCPRequiredRequest) returns (MCPRequiredReply) {
    option (protomcp.v1.tool) = {};
  }
}

message MCPRequiredRequest {
  string name = 1 [(protomcp.v1.field_schema).required = true];
  string note = 2 [(protomcp.v1.field_schema).required = false];
}

message MCPRequiredReply {
  string result = 1;
}
