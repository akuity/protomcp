syntax = "proto3";

package protomcp.gen.testdata.outputexclusions.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/outputexclusions;outputexclusionsv1";

// Inventory pairs a list RPC with a detail RPC over the same messages.
// Ratings.reviews opts out of the list RPC's output only, so the detail
// RPC keeps it; field_schema.exclude would take it away from both.
service Inventory {
  rpc ListProducts(ListProductsRequest) returns (ListProductsReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }

  rpc GetProduct(GetProductRequest) returns (GetProductReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
}

message ListProductsRequest {
  string filter = 1;
}

message ListProductsReply {
  repeated Product products = 1;
}

message GetProductRequest {
  string id = 1;
}

message GetProductReply {
  Product product = 1;
}

message Product {
  string name = 1;
  Ratings ratings = 2;
}

message Ratings {
  uint32 review_count = 1;
  repeated Review reviews = 2 [(protomcp.v1.field_schema).exclude_from_outputs = "protomcp.gen.testdata.outputexclusions.v1.Inventory.ListProducts"];
}

message Review {
  string body = 1;
}
