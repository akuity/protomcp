syntax = "proto3";

package protomcp.gen.testdata.outputexclusionsshared.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/outputexclusionsshared;outputexclusionssharedv1";

// Product lives apart from the service that returns it, so generating
// this file alone hands the plugin no view of the RPC named below.
message Product {
  string name = 1;
  Ratings ratings = 2;
}

message Ratings {
  uint32 review_count = 1;
  repeated Review reviews = 2 [(protomcp.v1.field_schema).exclude_from_outputs = "protomcp.gen.testdata.outputexclusionssplit.v1.Catalog.ListProducts"];
}

message Review {
  string body = 1;
}
