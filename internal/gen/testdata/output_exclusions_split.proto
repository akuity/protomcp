syntax = "proto3";

package protomcp.gen.testdata.outputexclusionssplit.v1;

import "output_exclusions_shared.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/outputexclusionssplit;outputexclusionssplitv1";

service Catalog {
  rpc ListProducts(ListProductsRequest) returns (ListProductsReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }

  rpc GetProduct(GetProductRequest) returns (GetProductReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
}

message ListProductsRequest {
  string filter = 1;
}

message ListProductsReply {
  repeated protomcp.gen.testdata.outputexclusionsshared.v1.Product products = 1;
}

message GetProductRequest {
  string id = 1;
}

message GetProductReply {
  protomcp.gen.testdata.outputexclusionsshared.v1.Product product = 1;
}
