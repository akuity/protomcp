syntax = "proto3";

package protomcp.gen.testdata.promptrequiredness.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/promptrequiredness;promptrequirednessv1";

service PromptRequiredness {
  rpc Render(PromptRequirednessRequest) returns (PromptRequirednessReply) {
    option (protomcp.v1.prompt) = {template: "{{text}}"};
  }
}

message PromptRequirednessRequest {
  string api_required = 1 [(google.api.field_behavior) = REQUIRED];
  string protovalidate_required = 2 [(buf.validate.field).required = true];
  string required_ignore_always = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).ignore = IGNORE_ALWAYS
  ];
  string required_ignore_zero = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  optional string required_ignore_zero_with_presence = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string mcp_required = 6 [(protomcp.v1.field_schema).required = true];
  string mcp_optional = 7 [(protomcp.v1.field_schema).required = false];
}

message PromptRequirednessReply {
  string text = 1;
}
