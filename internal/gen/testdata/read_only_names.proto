syntax = "proto3";

package protomcp.gen.testdata.readonlynames.v1;

import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/readonlynames;readonlynamesv1";

service ReadOnlyNames {
  rpc GetWidget(GetWidgetRequest) returns (Widget) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
  rpc SettingsInfo(SettingsInfoRequest) returns (SettingsInfoReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
  rpc SetDifference(SetDifferenceRequest) returns (SetDifferenceReply) {
    option (protomcp.v1.tool) = {
      read_only: true
      disable_read_only_name_lint: true
    };
  }
}

message GetWidgetRequest {
  string id = 1;
}

message Widget {
  string id = 1;
  string name = 2;
}

message ListWidgetsRequest {
  int32 page_size = 1;
}

message ListWidgetsReply {
  repeated Widget widgets = 1;
}

message SettingsInfoRequest {
  string scope = 1;
}

message SettingsInfoReply {
  string value = 1;
}

message SetDifferenceRequest {
  repeated string left = 1;
  repeated string right = 2;
}

message SetDifferenceReply {
  repeated string result = 1;
}
