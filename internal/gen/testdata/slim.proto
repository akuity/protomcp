syntax = "proto3";

package protomcp.gen.testdata.slim.v1;

import "google/api/field_behavior.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/akuity/protomcp/internal/gen/testdata/slim;slimv1";

service Slim {
  rpc Describe(DescribeRequest) returns (DescribeReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
  rpc Watch(DescribeRequest) returns (stream DescribeReply) {
    option (protomcp.v1.tool) = {
      read_only: true
    };
  }
  rpc Fetch(FetchRequest) returns (DescribeReply) {
    option (protomcp.v1.resource_template) = {
      uri_template: "slim://{id}"
      uri_bindings: [{placeholder: "id", field: "id"}]
      name_field: "{{summary}}"
    };
  }
  rpc Enumerate(EnumerateRequest) returns (EnumerateReply) {
    option (protomcp.v1.resource_list) = {
      item_path: "items"
      uri_template: "slims://{id}"
      uri_bindings: [{placeholder: "id", field: "id"}]
      name_field: "{{summary}}"
    };
  }
  rpc Review(FetchRequest) returns (DescribeReply) {
    option (protomcp.v1.prompt) = {
      template: "Summary: {{summary}}"
    };
  }
}

message FetchRequest {
  string id = 1;
  string trace = 2 [(protomcp.v1.field_schema).exclude = true];
}

message EnumerateRequest {
  string filter = 1;
}

message EnumerateReply {
  repeated SlimItem items = 1;
}

message SlimItem {
  string id = 1;
  string summary = 2;
  string secret_blob = 3 [(protomcp.v1.field_schema).exclude = true];
}

message DescribeRequest {
  string id = 1;
  string huge_selector = 2 [(protomcp.v1.field_schema).exclude = true];
  Nested nested = 3;
  string server_ref = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protomcp.v1.field_schema).exclude = true
  ];
}

message Nested {
  string keep = 1;
  string omit = 2 [(protomcp.v1.field_schema).exclude = true];
}

message DescribeReply {
  string summary = 1;
  string debug_blob = 2 [(protomcp.v1.field_schema).exclude = true];
  Nested nested = 3;
}
